name: Deploy to Production (Professional Rsync)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy via SCP & Rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload to Temp Folder
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "app,bootstrap,config,database,public,resources,routes,storage,artisan,composer.json,package.json"
          target: "/home/taalimu/htdocs/taalimu.com/deploy_tmp"
          strip_components: 0

      - name: Sync Files and Clear Cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/taalimu/htdocs/taalimu.com
            # استخدام rsync لنقل الملفات وحل مشاكل الصلاحيات
            rsync -rtv deploy_tmp/ .
            # تنظيف المجلد المؤقت
            rm -rf deploy_tmp
            # مسح كاش لارافيل
            php artisan optimize:clear
            echo "Deployment successful!"
