name: Deploy to Production (SFTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          password: ${{ secrets.SSH_PASSWORD }}
          local_path: './'
          remote_path: '/home/taalimu/htdocs/taalimu.com'
          # تحديد المجلدات الأساسية فقط لسرعة الرفع
          sftpArgs: '-o ConnectTimeout=60'
          delete_remote_files: false
          exclude: |
            .git/**
            node_modules/**
            vendor/**
            tests/**
            deployment_scripts/**
            .env*
            *.md
