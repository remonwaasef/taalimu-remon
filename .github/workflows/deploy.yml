name: Deploy to Production (Auto-Discovery Strategy)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Auto-Discover and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Discover and Sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Searching for the real site path..."
            # البحث عن المجلد الذي يحتوي على ملفات لارافيل الحقيقية
            REAL_PATH=$(find /home/taalimu/htdocs -name "artisan" | head -n 1 | xargs dirname)
            echo "Found real path: $REAL_PATH"
            
            if [ -z "$REAL_PATH" ]; then
              echo "Error: Could not find Laravel installation!"
              exit 1
            fi
            
            # حفظ المسار في ملف مؤقت لاستخدامه في الخطوات القادمة إذا لزم الأمر
            echo "$REAL_PATH" > ~/site_path.txt

      - name: Upload to Home Directory
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "app,bootstrap,config,database,public,resources,routes,storage,artisan,composer.json,package.json"
          target: "deploy_tmp"
          strip_components: 0

      - name: Move to Real Path and Clear Cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            REAL_PATH=$(cat ~/site_path.txt)
            echo "Syncing to $REAL_PATH..."
            rsync -rtv ~/deploy_tmp/ $REAL_PATH/
            rm -rf ~/deploy_tmp
            cd $REAL_PATH
            php artisan optimize:clear
            echo "ANTIGRAVITY_DEPLOY_SUCCESS" > $REAL_PATH/public/test_check.txt
            echo "Deployment to $REAL_PATH Successful!"
