name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Self-hosted runner on the production VPS itself (outbound-only polling).
    # Replaced the SSH-from-GitHub approach: Hostinger's edge firewall drops
    # inbound :22 from some Azure ranges intermittently (incident 2026-07-04).
    runs-on: [self-hosted, taalimu-prod]
    steps:
      - uses: actions/checkout@v4
        with:
          path: /home/taalimu/htdocs/taalimu.com

      - name: Deploy on server
        run: |
          cd /home/taalimu/htdocs/taalimu.com

          export GIT_TERMINAL_PROMPT=0

          # Maintenance mode
          php artisan down --retry=60 || true

          # Backup before deploy
          php artisan backup:run --only-db || echo "WARNING: pre-migration backup failed"

          # .env is untracked but existed in old commits, so a reset that
          # crosses those commits can delete it. Guard it around git ops.
          cp -f .env /tmp/taalimu.env.deploy_guard

          git fetch origin main
          git reset --hard origin/main

          if [ ! -f .env ]; then cp -f /tmp/taalimu.env.deploy_guard .env; fi

          export COMPOSER_ALLOW_SUPERUSER=1
          composer install --no-dev --optimize-autoloader
          npm ci --no-audit --no-fund
          npm run build

          php artisan migrate --force
          php artisan storage:link || true
          php artisan optimize
          php artisan queue:restart

          chown -R taalimu:taalimu storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache

          # Bring back online
          php artisan up
