name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          # Fail the job on the FIRST failing command. Without this, a failed
          # `git fetch` was swallowed and `reset --hard` rolled production back
          # to a stale origin/main (incident: 2026-07-04).
          script_stop: true
          script: |
            cd /home/taalimu/htdocs/taalimu.com

            # Prevent Git from prompting for credentials
            export GIT_TERMINAL_PROMPT=0

            # .env is untracked but existed in old commits, so a reset that
            # crosses those commits can delete it (2026-07-04 incident).
            # Guard it around the git operations.
            cp -f .env /tmp/taalimu.env.deploy_guard

            # Fetch latest changes and reset
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then cp -f /tmp/taalimu.env.deploy_guard .env; fi

            # Install dependencies
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            
            # Safety net: back up the database before running migrations
            php artisan backup:run --only-db || echo "WARNING: pre-migration backup failed"

            # Run Laravel commands
            php artisan migrate --force
            php artisan storage:link
            php artisan optimize:clear
            php artisan queue:restart
            
            # Fix permissions
            chown -R taalimu:taalimu storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache
