name: Deploy to Production (SSH/SFTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  ssh-deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "htdocs/taalimu.com" # مسار الموقع النسبي للمستخدم الجديد في CloudPanel
          strip_components: 0
          # استثناء الملفات
          exclude: ".git,node_modules,vendor,tests,deployment_scripts,playwright-report,test-results,docs,.env*,*.md"
