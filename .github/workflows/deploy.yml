name: Deploy to Production (SSH/SFTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  ssh-deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "app,bootstrap,config,database,public,resources,routes,storage,artisan,composer.json,package.json"
          target: "/home/taalimu/htdocs/taalimu.com"
          strip_components: 0
