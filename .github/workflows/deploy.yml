name: Deploy to Production (Reliable SFTP)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy Core Folders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload App Folder
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          password: ${{ secrets.SSH_PASSWORD }}
          local_path: './app'
          remote_path: '/home/taalimu/htdocs/taalimu.com/app'

      - name: Upload Resources Folder
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          password: ${{ secrets.SSH_PASSWORD }}
          local_path: './resources'
          remote_path: '/home/taalimu/htdocs/taalimu.com/resources'

      - name: Upload Routes Folder
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          password: ${{ secrets.SSH_PASSWORD }}
          local_path: './routes'
          remote_path: '/home/taalimu/htdocs/taalimu.com/routes'

      - name: Upload Config Folder
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          password: ${{ secrets.SSH_PASSWORD }}
          local_path: './config'
          remote_path: '/home/taalimu/htdocs/taalimu.com/config'

      - name: Clear Cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/taalimu/htdocs/taalimu.com
            php artisan optimize:clear
