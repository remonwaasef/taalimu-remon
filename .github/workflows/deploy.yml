name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/taalimu/htdocs/taalimu.com
            
            # Prevent Git from prompting for credentials
            export GIT_TERMINAL_PROMPT=0
            
            # Fetch latest changes and reset
            git fetch origin main
            git reset --hard origin/main
            
            # Install dependencies
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            
            # Safety net: back up the database before running migrations
            php artisan backup:run --only-db || echo "WARNING: pre-migration backup failed"

            # Run Laravel commands
            php artisan migrate --force
            php artisan storage:link
            php artisan optimize:clear
            php artisan queue:restart
            
            # Fix permissions
            chown -R taalimu:taalimu storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache
