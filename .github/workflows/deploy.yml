name: Deploy to Production (Home Sync Strategy)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy via Home Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload to Home Directory
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "app,bootstrap,config,database,public,resources,routes,storage,artisan,composer.json,package.json"
          target: "deploy_tmp"
          strip_components: 0

      - name: Sync to Site and Clear Cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            SITE_PATH="/home/taalimu/htdocs/taalimu.com"
            # مزامنة الملفات
            rsync -rtv ~/deploy_tmp/ $SITE_PATH/
            # إنشاء ملف اختبار للتأكد من المسار
            echo "ANTIGRAVITY_DEPLOY_SUCCESS" > $SITE_PATH/public/test_check.txt
            # تنظيف
            rm -rf ~/deploy_tmp
            # مسح كاش لارافيل
            cd $SITE_PATH
            php artisan optimize:clear
            echo "Deployment Successful!"
