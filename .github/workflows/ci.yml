name: CI

# Quality gate: runs the test suite, code-style check and dependency audit
# on every push and pull request. Deployment (deploy.yml) should only run
# once this workflow is green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo, sqlite, pdo_sqlite, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      # .env must exist before Composer's post-autoload-dump runs
      # `package:discover`, otherwise app boot falls back to config defaults
      # and (with phpredis loaded on the runner) tries to connect to Redis.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Generate key & discover packages
        run: |
          php artisan key:generate
          php artisan package:discover

      - name: Run tests
        run: php artisan test

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    # Informational for now (existing code predates Pint). Make blocking once clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # --no-scripts: this job only lints, it never boots the app, so skip
      # package:discover (which would try to connect to Redis without an .env).
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Check code style
        run: vendor/bin/pint --test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational for now — review advisories, then make blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # --no-scripts: audit only inspects composer.lock, no app boot needed.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --no-interaction
