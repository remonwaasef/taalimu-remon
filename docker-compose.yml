version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    depends_on:
      - app

  # Runs queued jobs (mailables are ShouldQueue — without this worker they never send
  # when QUEUE_CONNECTION is database/redis).
  worker:
    image: laravel-app
    container_name: laravel_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_network
    depends_on:
      - app
      - db
      - redis

  # Fires the Laravel scheduler every minute (payment reminders, Telegram reports, backups —
  # see routes/console.php).
  scheduler:
    image: laravel-app
    container_name: laravel_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_network
    depends_on:
      - app
      - db

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - laravel_network

  db:
    image: mariadb:10.11
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_USER: ${DB_USERNAME:-laravel}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network
    ports:
      - "3306:3306"

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
