<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body x-data="{ theme: 'light' }" class="h-full">
    <div class="container p-5">
        <!-- Replicates the language switcher from _tab-plans.blade.php -->
        <div x-data="{
            activeLang: 'ar',
            arVal: 'اسم الباقة بالعربي',
            enVal: 'Package EN Name',
            frVal: 'Nom FR'
        }">
            <div class="d-flex gap-1">
                <button type="button" id="btn-ar" @click="activeLang = 'ar'" :class="activeLang === 'ar' ? 'btn-primary' : 'btn-light'">AR</button>
                <button type="button" id="btn-en" @click="activeLang = 'en'" :class="activeLang === 'en' ? 'btn-primary' : 'btn-light'">EN</button>
                <button type="button" id="btn-fr" @click="activeLang = 'fr'" :class="activeLang === 'fr' ? 'btn-primary' : 'btn-light'">FR</button>
            </div>
            <div id="input-ar" x-show="activeLang === 'ar'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                <input type="text" class="form-control" id="ar-input" value="AR value">
            </div>
            <div id="input-en" x-show="activeLang === 'en'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" style="display: none;">
                <input type="text" class="form-control" id="en-input" value="EN value">
            </div>
            <div id="input-fr" x-show="activeLang === 'fr'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" style="display: none;">
                <input type="text" class="form-control" id="fr-input" value="FR value">
            </div>
        </div>

        <!-- Replicates the Add Package Bootstrap Modal -->
        <button type="button" class="btn btn-outline-primary" id="open-modal" data-bs-toggle="modal" data-bs-target="#addPackageModal">فتح المودال</button>
        <div class="modal fade" id="addPackageModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-4 border-0">
                    <div class="modal-header">
                        <h5 class="fw-bold">باقة جديدة</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form method="POST" action="/nothing">
                        <div class="modal-body">
                            <label class="form-label">الاسم</label>
                            <input type="text" class="form-control" id="modal-input">
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">إنشاء</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Accordion replicate -->
        <div class="accordion mt-5" id="regionalAccordion1">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" id="acc-btn" type="button" data-bs-toggle="collapse" data-bs-target="#acc-content">Egypt (EGP)</button>
                </h2>
                <div id="acc-content" class="accordion-collapse collapse" data-bs-parent="#regionalAccordion1">
                    <div class="accordion-body" id="acc-body">محتوى السعر</div>
                </div>
            </div>
        </div>
    </div>

    <!-- THE SECOND ALPINE LOAD (as in _settings-scripts.blade.php) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
